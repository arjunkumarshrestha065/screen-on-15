name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check project structure
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts is missing."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: app/src/main/AndroidManifest.xml is missing."
            exit 1
          fi

      - name: Make Gradle Wrapper executable
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x gradlew

      - name: Build APK using Gradle Wrapper
        if: ${{ hashFiles('gradlew') != '' }}
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Build APK without Gradle Wrapper
        if: ${{ hashFiles('gradlew') == '' }}
        run: gradle clean assembleDebug --stacktrace

      - name: Show generated APK files
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK_FILE" apk-output/SignageLauncher-debug.apk

          echo "APK copied successfully:"
          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignageLauncher-Debug-APK
          path: apk-output/SignageLauncher-debug.apk
          if-no-files-found: error
          retention-days: 30
